<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        .contact-box{
            background:linear-gradient(45deg, #fff,#86d, #95d,#83d,#94d);
            height: 60vh;
            width: 400px;
            display:flex;
            justify-content:space-evenly;
            align-items: center;
            border-radius: 10px;
            margin: auto;
            margin-top: 60px;
            color:black;
            gap:10px;
            align-items: center;
        }

        body{
            background-image: url(wooden.webp);

        }

        .container{
            background-color: aqua;
            height: 4vh;
            width: 70px;
            border-radius:4px;
            text-align: center;
            margin-top: 40px;
        }

        .container a{
            text-decoration: none;
            color: #83d;
        }

        .container:hover{
            background-color: black;
            transition: background-color 0.3 ease;
            transform: scale(1.2) translateX(10px);
            
        }
        .Whatsapp{
            background-color: bisque;
            height: 4vh;
            width: 70px;
            border-radius: 4px;
            text-align: center;
            margin-top:40px ;
        }

        .Whatsapp a{
            text-decoration: none;
            color: hsl(120, 41%, 11%);
        }

        .Whatsapp:hover{
            background-color:greenyellow;
            transition: backround-color 0.3 ease;
            transform: translateY(10px);
        }


         .telegram{
            background-color: cornflowerblue;
            height: 4vh;
            width: 70px;
            border-radius: 4px;
            text-align: center;
            margin-top:40px ;
        }

        .telegram a{
            text-decoration: none;
            color: hsl(120, 41%, 11%);
        }

        .telegram:hover{
            background-color: aquamarine;
            transition: all;
            transform: translateX(-10px);
        }
         .X{
            background-color: darkgray;
            height: 4vh;
            width: 70px;
            border-radius: 4px;
            text-align: center;
            margin-top:40px ;
        }

        .X a{
            text-decoration: none;
            color: hsl(120, 41%, 11%);
        }

        .X:hover{
            background-color: yellow;
            transition: 6ms;
            transform: translateX(10px);
        }
        h1{
            text-align: justify;
            font-size: 15px;
            margin: 10px;
        }
        .home-box{
            background-color:#d419ac;
            border-radius: 5px;
            width:70px;
            height:3vh;
            text-align: center;
            margin-top:40px;
            padding: 5px;  
        }
        .home-box a{
            text-decoration: none;
            color: hsl(120, 41%, 11%);
        }
        .home-box:hover{
            background-color: #9117afe0;
            transition: background-color 0.3 ease;
        }


    </style>
</head>
<body>
    <div class="contact-box">
        <h1>Reach us On 0758806207 or </h1>
        <ul>
            <div class="container">
                <a href="/bri_hotspot.facebook.com">Facebook</a>
            </div>
            <div class="Whatsapp">
                <a href="/bri_hotspot.whasapp.com">Whatsapp</a>
            </div>
            <div class="telegram">
                <a href="/bri_hotspot.telegram">Telegram</a>
            </div>
            <div class="X">
                <a href="/bri_hotspot.xtwitter">X Twitter</a>
            </div>
             <div class="home-box">
                <a href="/Bri_HTML/index.html">Home</a>
            </div>
        </ul>
    </div>
    
    
</body>
</html>
