<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for a BRI_HOTSPOT account to access fast and affordable internet packages.">
    <title>register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="register-box">
        <h2>Create Account</h2>
        <form action="register" method="POST">
            <label for="fullname" style="display:none;">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Full Name" required>
            <label for="email" style="display:none;">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Email Address" required>
            <label for="username" style="display:none;">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose username" required>
            <label for="password" style="display:none;">Password</label>
            <input type="password" id="password" name="password" placeholder="Create Password" required>
            <label for="confirm_password" style="display:none;">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="submit">Register</button>
            <p>Already have an account? <a href="sign_up_form.html">Sign Up</a></p>
        </form>
    </div>
    
</body>
</html>
