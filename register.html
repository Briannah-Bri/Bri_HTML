<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:url(wooden.webp);

        }
        .register-box{
            background:blueviolet;
            padding: 70px;
            width: 250px;
            height: 60vh;
            border-radius: 10px;
            text-align: center;
            align-items: center;
            justify-content: center;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            gap: 10px;

        }
        .register-box h2{
            margin-bottom: 20px;
            color:white;
            font-family: auto;
        }
        .register-box input{
            width: 250px;
            color: #27ae60;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            background-color: white;
            font-family: monospace;
        }

        .register-box button{
            width: 150px;
            padding: 12px;
            background: #2ecc71;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            margin-top:10px;
            font-family: auto;
        }
        .register-box button:hover{
            background: #27ae60;

        }
        .register-box p{
            margin-top: 15px;
            font-size: 14px;
            font-family: auto;
        }
        p{
            color: #fff;
        }
        p a{
            text-decoration: none;
            color: hsl(120, 41%, 11%);
        }

    </style>
</head>
<body>
    <div class="register-box">
        <h2>Create Account</h2>
        <form action="/register" method="POST">
            <input type="text" name="fullname" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="text" name="username" placeholder="Choose username" required>
            <input type="password" name="password" placeholder="Create Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="submit">Register</button>
            <p>Already have an account? <a href="/Bri_HTML/sign_up_form.html">Sign Up</a></p>
        </form>
    </div>
    
</body>
</html>
