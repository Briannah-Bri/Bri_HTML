<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <style>
        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:url(wooden.webp);
        }
        .login-box{
            background-color:blueviolet;
            padding: 30px;
            width: 250px;
            border-radius: 10px;
            text-align: center;
            align-items: center;
            justify-content: center;
            display: flex;
            flex-direction: column;

        }
        .login-box h2{
            margin-bottom: 20px;
            color: #333;
            font-family: auto;
        }
        .login-box input{
            width: 250px;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-family: monospace;
        }
        .login-box button{
            width: 100px;
            padding: 12px;
            background-color:#3498db;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-family: auto;
        }
        .login-box button:hover{
            background:#2980b9;
            animation: alternate-reverse;
            transition: background-color 0.3 ease;
        }
        .login-box p{
            margin-top: 15px;
            font-size: 14px;
            font-family: auto;
        }
        p a{
            color: rgb(176, 191, 230);
            text-decoration: none;
        }
    
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Enter Email" required>
            <input type="password" name="password" placeholder="Enter Password" required>
            <button type="submit">Login</button>
            <p>Don't have an account? <a href="register.html">Register</a></p>
            
        </form>
    </div>
</body>
</html>
